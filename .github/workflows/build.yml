name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build APK
        run: gradle assembleDebug

      - name: Prepare Jeebban APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Jeebban.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Jeebban-APK
          path: app/build/outputs/apk/debug/Jeebban.apk

